{% extends "base.html" %}
{% block content %}
<section class="wrap project-detail">
  <a class="back-link" href="{{ url_for('site.work') }}" data-ar="↙ العودة إلى الأعمال" data-en="↙ Back to work">↙ العودة إلى الأعمال</a>
  <p class="eyebrow" data-ar="{{ project['category_ar'] }}" data-en="{{ project['category_en'] }}">{{ project['category_ar'] }}</p>
  <h1 data-ar="{{ project['title_ar'] }}" data-en="{{ project['title_en'] }}">{{ project['title_ar'] }}</h1>
  <p class="project-description" data-ar="{{ project['description_ar'] }}" data-en="{{ project['description_en'] }}">{{ project['description_ar'] }}</p>
  <img class="project-cover" src="{{ project['image_url'] }}" alt="{{ project['title_ar'] }}">
  <div class="project-detail-bottom">
    <span data-ar="الهوية · الفكرة · التفاصيل" data-en="Identity · Concept · Details">الهوية · الفكرة · التفاصيل</span>
    <a class="underlined-link" href="{{ url_for('site.contact') }}" data-ar="ابدأ مشروعاً مشابهاً ↙" data-en="Start a similar project ↙">ابدأ مشروعاً مشابهاً ↙</a>
  </div>
</section>
{% endblock %}
